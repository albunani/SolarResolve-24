services:
  - type: web
    name: solarresolve-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # AI Provider configuration to be added when Day 4 AI integration begins
      # - key: GEMINI_API_KEY
      #   sync: false
